[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topprism-ssi"
version = "0.1.0"
description = "TopPrism Spatial Source Integrity (SSI) — Governed Spatial Admission Capability"
readme = "Spatial_Source_Integrity_v1/00_README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
    { name = "TopPrism Spatial Decision Intelligence Team", email = "ssi@topprism.ai" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyarrow>=15.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.18",
]

[tool.setuptools.packages.find]
include = ["ssi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
